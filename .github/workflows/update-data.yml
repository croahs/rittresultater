# Weekly check for new races. Fetches only what isn't cached (a couple of
# requests to Turritt and EQ Timing on a normal week), rebuilds data/results.json
# and commits it; Cloudflare Pages then republishes the site.
#
# Inert until the INTERVALS_API_KEY secret exists (Settings > Secrets and
# variables > Actions). Another rider's key goes in as its own secret, named
# as in riders.json ("intervals_key_env"), and is added to env below.
name: Update race data

on:
  schedule:
    - cron: "0 5 * * 1"  # Mondays 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check that the intervals.icu key is set
        id: guard
        env:
          KEY: ${{ secrets.INTERVALS_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::notice::INTERVALS_API_KEY is not set, so nothing was updated."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.ready == 'true'

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.ready == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        if: steps.guard.outputs.ready == 'true'
        run: pip install -r requirements.txt

      - name: Rebuild data
        if: steps.guard.outputs.ready == 'true'
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
        run: |
          python3 update.py
          python3 rivals.py
          python3 export_web.py

      - name: Commit if anything changed
        if: steps.guard.outputs.ready == 'true'
        run: |
          git add -A data cache riders.json race_results_auto.csv points_races.csv turritt_vs_sheet.md
          if git diff --cached --quiet; then
            echo "No new races."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update race data"
          git push
