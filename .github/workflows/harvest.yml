# Nightly harvest (harvest.py): every cycling race in Norway, found from EQ Timing's and
# raceresult's own calendars, and each race's result lists fetched once, 8 to 15 s (random) between requests.
# The first nights work through the backlog (about 4,600 races since 2008); after that only new
# races are fetched.
#
# 5.5 hours a night. The repo is public (2026-10-11), so Actions minutes are free; while it was
# private, this job used up the 2,000 free minutes a month in six nights.
#
# The lists live on the branch "harvest", checked out in cache/harvest, never on main. The
# first run creates that branch. Nothing on the site can start this job.
name: Harvest race results

# EQ Timing's lists come from the open calls live.eqtiming.com uses until EQ gives us a key for
# their official API (Pedår chose «Kjør nå», 2026-09-29). A 403 or 429 from a source stops the run
# (harvest.Blocked) and the job fails, so it shows up; nothing works around a block.
on:
  schedule:
    - cron: "0 22 * * *"  # 22:00 UTC = midnight in Norway (summer time); fetching stops after 5.5 hours
  workflow_dispatch:
    inputs:
      minutes:
        description: "Minutes to spend fetching lists"
        default: "330"

permissions:
  contents: write

concurrency:
  group: harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Check out the harvest branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898299+github-actions[bot]@users.noreply.github.com"
          url="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$url" harvest >/dev/null; then
            git clone --quiet --single-branch --branch harvest --depth 1 "$url" cache/harvest
          else
            mkdir -p cache/harvest && cd cache/harvest
            git init --quiet -b harvest && git remote add origin "$url"
          fi

      - name: Harvest
        run: python3 harvest.py "${{ github.event.inputs.minutes || '330' }}"

      - name: Commit to the harvest branch
        if: always()
        working-directory: cache/harvest
        run: |
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit --quiet -m "Harvest $(date -u +%F): $(git diff --cached --name-only | grep -c json.gz || true) race files"
          git push --quiet origin harvest
